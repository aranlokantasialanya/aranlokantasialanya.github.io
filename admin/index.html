<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aran Lokantası Yönetim Paneli</title>
<meta name="theme-color" content="#7b1f2e">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Aran Panel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Tek görünüm: krem zemin, bordo vurgu — sitenin kimliğiyle aynı */
  :root{
    color-scheme:light;
    --bordo:#7b1f2e; --bordo-koyu:#5e1622; --pembe:#f6e3e5; --krem:#fbf7f2; --kart:#ffffff;
    --yazi:#2a2224; --soluk:#7d7073; --cizgi:#e8dcd6; --yesil:#2f7a4a; --kirmizi:#b3261e; --acik:#f4ece6;
    --baslik:"Libre Baskerville",Georgia,serif; --govde:"Source Sans 3",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:var(--govde);background:var(--krem);color:var(--yazi);font-size:16px;line-height:1.4;padding-bottom:110px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--bordo);outline-offset:2px}
  .ic{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  header{background:var(--bordo);color:#fff;padding-top:env(safe-area-inset-top,0px)}
  header .ic{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 14px}
  header h1{font-family:var(--baslik);font-size:19px;letter-spacing:1px}
  header small{display:block;font-size:13px;opacity:.8;margin-top:2px}
  header a{color:#fff;font-size:14px;font-weight:600;white-space:nowrap}

  .sekmeler{position:sticky;top:0;z-index:15;background:var(--krem);border-bottom:1px solid var(--cizgi)}
  .sekmeler .ic{display:flex;gap:4px;padding-block:8px;overflow-x:auto;scrollbar-width:none}
  .sekmeler button{flex-shrink:0;border:0;background:transparent;color:var(--bordo);font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px}
  .sekmeler button[aria-selected="true"]{background:var(--bordo);color:#fff}

  main .ic{padding-block:6px}
  .bilgi{background:var(--acik);border-radius:12px;padding:12px 14px;font-size:15px;margin-top:14px}
  .kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-top:16px}
  .kart h3{font-family:var(--baslik);color:var(--bordo);font-size:16px;margin-bottom:10px}
  .alan{display:block;margin-top:12px}
  .alan:first-of-type{margin-top:0}
  .alan>span{display:block;font-size:14px;color:var(--soluk);margin-bottom:4px}
  .alan input,.alan textarea{display:block;width:100%;border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;background:var(--kart)}
  .alan textarea{min-height:110px;resize:vertical;line-height:1.45}
  .ipucu{font-size:13px;color:var(--soluk);margin-top:4px}

  /* Menü */
  .kategori{margin-top:26px}
  .kat-ust{display:flex;align-items:center;gap:4px;border-bottom:2px solid var(--bordo);padding-bottom:6px}
  .kat-adlar{flex:1;min-width:0;display:flex;flex-direction:column}
  .kat-ad{min-width:0;font-family:var(--baslik);color:var(--bordo);font-size:18px;letter-spacing:1px;text-transform:uppercase;border:0;background:transparent;padding:6px 4px;border-radius:6px;width:100%}
  .kat-ad:hover,.kat-ad:focus{background:#fff}
  .kat-en{border:0;background:transparent;font-size:14px;color:var(--soluk);padding:2px 4px;border-radius:6px;width:100%}
  .kat-en:hover,.kat-en:focus{background:#fff}

  .urun{display:flex;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--cizgi)}
  .urun.gizli .foto-btn,.urun.gizli .ad{opacity:.45}
  .urun.tukendi .ad{color:var(--soluk);text-decoration:line-through}
  .tutamak{flex-shrink:0;width:28px;align-self:stretch;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#b9a7a0;cursor:grab;touch-action:none;border-radius:8px;padding:0}
  .tutamak:active{cursor:grabbing}
  .tutamak svg{width:20px;height:20px}
  .surukleniyor{opacity:.35}
  .secili{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:12px}
  .foto-alan{position:relative;flex-shrink:0;width:68px;height:68px}
  .foto-btn{width:68px;height:68px;border-radius:12px;border:1.5px dashed #cdbab3;background:var(--acik);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--soluk);overflow:hidden;position:relative;padding:0}
  .foto-btn img{width:100%;height:100%;object-fit:cover}
  .foto-btn.dolu{border:0}
  .foto-btn.dolu::after{content:"Değiştir";position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 0}
  .foto-btn svg{width:24px;height:24px}
  .foto-sil{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;border:2px solid var(--krem);background:var(--kirmizi);color:#fff;font-size:16px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .foto-sil.emin{width:auto;padding:0 8px;border-radius:13px;font-size:12px;right:-14px;white-space:nowrap}
  .sag{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .ad{width:100%;border:1px solid var(--cizgi);background:var(--kart);border-radius:10px;padding:10px 12px;font-size:17px}
  .ad-en-kutu{display:flex;align-items:center;border:1px solid var(--cizgi);background:var(--kart);border-radius:10px;overflow:hidden}
  .ad-en-kutu b{flex-shrink:0;font-size:11px;letter-spacing:.06em;color:var(--bordo);background:var(--pembe);padding:10px 8px;align-self:stretch;display:flex;align-items:center}
  .ad-en{flex:1;min-width:0;border:0;padding:8px 10px;font-size:15px;background:transparent}
  .alt{display:flex;align-items:center;gap:6px}
  .fiyat-kutu{display:flex;align-items:center;border:1px solid var(--cizgi);background:var(--kart);border-radius:10px;overflow:hidden}
  .fiyat::-webkit-outer-spin-button,.fiyat::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fiyat{-moz-appearance:textfield;appearance:textfield;width:62px;border:0;padding:9px 4px 9px 10px;font-weight:700;font-size:17px;color:var(--bordo-koyu);font-variant-numeric:tabular-nums;background:transparent}
  .fiyat-kutu span{padding-right:10px;font-weight:700;color:var(--bordo-koyu)}
  .tukendi-k{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap;color:var(--soluk);user-select:none;padding:6px 10px;border:1.5px solid var(--cizgi);border-radius:10px;background:var(--kart)}
  .tukendi-k input{width:20px;height:20px;accent-color:var(--kirmizi)}
  .tukendi-k:has(input:checked){border-color:var(--kirmizi);color:var(--kirmizi);background:#fdecea}
  .secenekler{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
  .gunler{display:flex;flex-wrap:wrap;align-items:center;gap:4px;width:100%}
  .gunler .baslik{font-size:13px;color:var(--soluk);margin-right:2px}
  .gunler .hepsi{font-size:13px;font-weight:700;color:var(--yesil)}
  .gun-k{position:relative}
  .gun-k input{position:absolute;opacity:0;width:1px;height:1px}
  .gun-k span{display:block;min-width:36px;text-align:center;border:1px solid var(--cizgi);background:var(--kart);border-radius:8px;padding:5px 6px;font-size:13px;font-weight:600;color:var(--soluk);cursor:pointer;user-select:none}
  .gun-k input:checked+span{background:var(--bordo);border-color:var(--bordo);color:#fff}
  .gun-k input:focus-visible+span{outline:2px solid var(--bordo);outline-offset:2px}
  .kucuk{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--soluk);user-select:none;white-space:nowrap}
  .kucuk input{width:18px;height:18px;accent-color:var(--bordo)}
  .sil{margin-left:auto;border:0;background:transparent;color:var(--soluk);padding:6px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:4px;flex-shrink:0}
  .sil svg{width:20px;height:20px}
  .sil.emin{background:var(--kirmizi);color:#fff;font-weight:700}
  .ekle{margin-top:10px;width:100%;border:1.5px dashed var(--bordo);background:transparent;color:var(--bordo);font-weight:700;border-radius:12px;padding:12px;font-size:16px}
  .ekle.buyuk{margin-top:28px;background:#fff}
  .ust-arac{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .ust-arac button{border:1.5px solid var(--kirmizi);background:#fdecea;color:var(--kirmizi);font-weight:700;border-radius:10px;padding:9px 12px;font-size:14px}
  details.kart summary{font-weight:700;cursor:pointer;color:var(--bordo)}
  details.kart[open] summary{margin-bottom:12px}

  /* Ana sayfa bölümleri */
  .bolum-k{display:flex;gap:8px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--cizgi)}
  .bolum-k:last-child{border-bottom:0}
  .bolum-k .sag input{border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;font-weight:700;font-size:16px;background:var(--kart);width:100%}
  .bolum-k .sag textarea{border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;min-height:130px;resize:vertical;width:100%;line-height:1.45;background:var(--kart)}

  /* Ziyaretçiler */
  .ozet{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .ozet .k{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px}
  .ozet small{display:block;color:var(--soluk);font-size:13px}
  .ozet strong{display:block;font-size:28px;line-height:1.1;margin:2px 0;font-variant-numeric:tabular-nums;color:var(--bordo-koyu)}
  .ozet span{font-size:13px;color:var(--soluk)}
  .gunluk{margin-top:16px}
  .gunluk .s{display:grid;grid-template-columns:62px 1fr 42px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
  .gunluk .t{color:var(--soluk);font-variant-numeric:tabular-nums}
  .gunluk .cubuk{height:16px;border-radius:4px;background:var(--acik);display:flex;overflow:hidden}
  .gunluk .m{background:var(--bordo)}
  .gunluk .a{background:#d9a3ac}
  .gunluk .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .lejant{display:flex;gap:14px;font-size:13px;color:var(--soluk);margin-top:8px}
  .lejant i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  ol.adimlar{padding-left:22px;margin-top:8px}
  ol.adimlar li{margin-bottom:8px}
  pre.kurallar{background:#2a2224;color:#f6e3e5;border-radius:10px;padding:12px;font-size:12px;overflow-x:auto;margin-top:8px;white-space:pre}
  .kucuk-btn{border:1.5px solid var(--bordo);background:#fff;color:var(--bordo);font-weight:700;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}

  /* Kampanya */
  .kmp-alan{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .kmp-onizleme{position:relative;width:110px;aspect-ratio:9/16;border-radius:14px;border:1.5px dashed #cdbab3;background:var(--acik);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--soluk);font-size:13px;text-align:center;padding:0;overflow:visible;flex-shrink:0}
  .kmp-onizleme img{width:100%;height:100%;object-fit:cover;border-radius:13px}
  .kmp-onizleme.dolu{border:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .kmp-onizleme svg{width:30px;height:30px}
  .kmp-ayar{flex:1;min-width:170px;display:flex;flex-direction:column;gap:12px}
  .anahtar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--acik);border-radius:12px;padding:12px 14px;font-weight:700}
  .anahtar input{width:24px;height:24px;accent-color:var(--yesil)}
  .kmp-ust{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .kmp-ust strong{font-family:var(--baslik);color:var(--bordo);font-size:15px}
  .kmp-ust .sil{margin-left:auto}
  .kmp-kart .tutamak{align-self:center;height:32px}
  .durum-rozet{align-self:flex-start;display:inline-block;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
  .durum-rozet.acik{background:#e3f5ea;color:var(--yesil)}
  .durum-rozet.kapali{background:var(--acik);color:var(--soluk)}
  .alan input[type=date]{max-width:220px}

  .alt-bar{position:fixed;left:0;right:0;bottom:0;background:var(--kart);border-top:1px solid var(--cizgi);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
  .alt-bar .ic{display:flex;align-items:center;gap:12px}
  .durum{flex:1;min-width:0;font-size:14px;color:var(--soluk)}
  .durum.degisti{color:var(--bordo);font-weight:600}
  .durum.tamam{color:var(--yesil);font-weight:600}
  .durum.hata{color:var(--kirmizi);font-weight:600}
  .kaydet{border:0;background:var(--bordo);color:#fff;font-weight:700;font-size:17px;padding:14px 22px;border-radius:12px;white-space:nowrap}
  .kaydet:disabled{background:#c9b9b3;cursor:default}

  .giris{max-width:440px;margin:40px auto;background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:22px}
  .giris h2{font-family:var(--baslik);color:var(--bordo);font-size:20px;margin-bottom:8px}
  .giris p{color:var(--soluk);font-size:15px}
  .giris input{width:100%;margin-top:16px;border:1px solid var(--cizgi);border-radius:10px;padding:12px}
  .giris button{width:100%;margin-top:12px;border:0;background:var(--bordo);color:#fff;font-weight:700;padding:14px;border-radius:12px;font-size:17px}
  .giris .hata{color:var(--kirmizi);margin-top:10px;font-size:14px}
  .yukleniyor{text-align:center;color:var(--soluk);padding:60px 0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header><div class="ic">
  <div><h1>ARAN LOKANTASI</h1><small>Yönetim Paneli</small></div>
  <a id="siteLink" href="../" target="_blank" rel="noopener">Siteyi gör ↗</a>
</div></header>

<div class="sekmeler" id="sekmeler" hidden><div class="ic" role="tablist">
  <button role="tab" data-sekme="menu" aria-selected="true">Menü</button>
  <button role="tab" data-sekme="anasayfa" aria-selected="false">Ana Sayfa</button>
  <button role="tab" data-sekme="kampanya" aria-selected="false">Kampanya</button>
  <button role="tab" data-sekme="ziyaret" aria-selected="false">Ziyaretçiler</button>
</div></div>

<main><div class="ic" id="ana"><p class="yukleniyor">Yükleniyor…</p></div></main>

<div class="alt-bar" id="altBar" hidden><div class="ic">
  <div class="durum" id="durum">Değişiklik yok</div>
  <button class="kaydet" id="kaydet" disabled>Kaydet</button>
</div></div>

<input type="file" id="dosya" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="../ceviri.js?v=20261107"></script>
<script>
/* Tarayıcı eski ceviri.js'yi hafızada tutuyorsa eksik yardımcıları tamamla */
(function(){
  var A=window.ARAN=window.ARAN||{kategori:{},urun:{},gun:{},arayuz:{tr:{},en:{}},arayuzEtiket:{}};
  A.kategori=A.kategori||{}; A.urun=A.urun||{}; A.gun=A.gun||{}; A.arayuz=A.arayuz||{tr:{},en:{}}; A.arayuzEtiket=A.arayuzEtiket||{};
  if(!A.HAFTA) A.HAFTA=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
  if(!A.gunler) A.gunler=function(u){ var l=Array.isArray(u&&u.gunler)?u.gunler:((u&&u.gun)?[u.gun]:[]); return A.HAFTA.filter(function(g){ return l.indexOf(g)>=0; }); };
  if(!A.tarih) A.tarih=function(){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ return new Date().toISOString().slice(0,10); } };
  if(!A.bugunGun) A.bugunGun=function(){ var g=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi']; try{ var s=new Intl.DateTimeFormat('tr-TR',{weekday:'long',timeZone:'Europe/Istanbul'}).format(new Date()); return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1); }catch(e){ return g[new Date().getDay()]; } };
  if(!A.haritaSorgu) A.haritaSorgu=function(i){ i=i||{}; return (i.harita||'').trim()||((i.ad||'Aran Lokantası')+', '+(i.adres||'Alanya')); };
})();
</script>
<script>
(function(){
  var DEMO = !!window.ARAN_DEMO;
  var KOK = window.ARAN_KOK || '../';
  // Sitenin kayıtlı olduğu GitHub deposu (site hangi adreste yayınlanırsa yayınlansın aynı kalır)
  var SAHIP = window.ARAN_SAHIP || 'aranlokantasialanya';
  var DEPO  = window.ARAN_DEPO  || 'aranlokantasialanya.github.io';
  var API = 'https://api.github.com/repos/' + SAHIP + '/' + DEPO;
  var ANAHTAR_KEY = 'aran-anahtar';
  var A = window.ARAN || {kategori:{},urun:{},arayuz:{en:{}},arayuzEtiket:{}};

  var ana=document.getElementById('ana'), altBar=document.getElementById('altBar'), sekmeKutu=document.getElementById('sekmeler');
  var durumEl=document.getElementById('durum'), kaydetBtn=document.getElementById('kaydet'), dosyaInput=document.getElementById('dosya');
  var onbellek={}, menu=null, site=null, degisti=false, anahtar=null, dal='main', fotoHedef=null, sekme='menu';
  try{ sekme=localStorage.getItem('aran-sekme')||'menu'; }catch(e){}

  function sakla(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
  function oku(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    for(var k in (attrs||{})){ var v=attrs[k]; if(v==null) continue;
      if(k==='text') e.textContent=v; else if(k==='html') e.innerHTML=v; else if(k==='value') e.value=v;
      else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v); else e.setAttribute(k,v); }
    (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function slug(s){ return (s||'urun').toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'urun'; }
  function kopya(o){ return JSON.parse(JSON.stringify(o)); }

  var IKON_FOTO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
  var IKON_TUT='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
  var IKON_SIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  function durum(metin, tur){ durumEl.textContent=metin; durumEl.className='durum'+(tur?' '+tur:''); }
  function degisiklik(){ degisti=true; kaydetBtn.disabled=false; durum('Kaydedilmemiş değişiklik var','degisti'); }
  window.addEventListener('beforeunload',function(e){ if(degisti){ e.preventDefault(); e.returnValue=''; } });

  // İki kez basınca silen buton
  function silButonu(etiket, soru, sil){
    var b=el('button',{class:'sil',type:'button','aria-label':etiket,html:IKON_SIL}), z=null;
    b.addEventListener('click',function(){
      if(!b.classList.contains('emin')){ b.classList.add('emin'); b.textContent=soru;

    img.onload=function(){

      var gorunur=k.aktif && var_ && (k.anasayfa!==false||k.menu!==false) && !bitti;
      rozet.className='durum-rozet '+(gorunur?'acik':'kapali');
      rozet.textContent=gorunur?'Sitede gösteriliyor':(bitti?'Süresi doldu':(!var_?'Görsel yok':'Gösterilmiyor'));
    }
    aktif.addEventListener('change',function(){ k.aktif=aktif.checked; degisiklik(); rozetGuncelle(); });
    var anaK=el('input',{type:'checkbox'}); anaK.checked=k.anasayfa!==false;
    anaK.addEventListener('change',function(){ k.anasayfa=anaK.checked; degisiklik(); rozetGuncelle(); });
    var menK=el('input',{type:'checkbox'}); menK.checked=k.menu!==false;
    menK.addEventListener('change',function(){ k.menu=menK.checked; degisiklik(); rozetGuncelle(); });
    var bitis=el('input',{type:'date',value:k.bitis||''});
    bitis.addEventListener('input',function(){ k.bitis=bitis.value; degisiklik(); rozetGuncelle(); });
    rozetGuncelle();
    var sil=silButonu('Kampanyayı sil','Silinsin mi?',function(){ site.kampanyalar.splice(site.kampanyalar.indexOf(k),1); degisiklik(); kampanyaCiz(); });
    var kart=el('div',{class:'kart kmp-kart'},[
      el('div',{class:'kmp-ust'},[ el('button',{class:'tutamak',type:'button','aria-label':'Sürükleyerek sırala',title:'Basılı tutup sürükleyin',html:IKON_TUT}), el('strong',{text:sira+'. kampanya'}), rozet, sil ]),
      el('div',{class:'kmp-alan'},[
        on,
        el('div',{class:'kmp-ayar'},[
          el('label',{class:'anahtar'},[el('span',{text:'Göster'}), aktif]),
          el('div',{},[ el('p',{class:'ipucu',style:'margin:0 0 6px',text:'Nerede gösterilsin?'}),
            el('label',{class:'kucuk',style:'margin-bottom:6px'},[anaK, el('span',{text:'Ana sayfa açılınca'})]),
            el('label',{class:'kucuk'},[menK, el('span',{text:'Menü açılınca (QR)'})]) ]),
          el('label',{class:'alan'},[el('span',{text:'Bitiş tarihi (isteğe bağlı)'}), bitis])
        ])
      ])
    ]);
    kart._k=k;
    return kart;
  }
  function kampanyaCiz(){
    if(sekme!=='kampanya') return;
    var kaydirma=window.scrollY; ana.innerHTML='';
    ana.appendChild(el('p',{class:'bilgi',text:'Kampanya görsellerinizi ekleyin (Instagram hikâye boyutu, 1080×1920). Birden fazla kampanya açıksa sitede yan yana çıkar, ziyaretçi parmağıyla kaydırarak gezer. Sırayı ⠿ ile değiştirin. Her kişiye bir kez gösterilir, × ile kapatılır.'}));
    var liste=el('div',{id:'kmpListe'});
    site.kampanyalar.forEach(function(k,i){ liste.appendChild(kampanyaKarti(k,i+1)); });
    ana.appendChild(liste);
    if(!site.kampanyalar.length) ana.appendChild(el('p',{class:'ipucu',style:'margin-top:14px',text:'Henüz kampanya yok.'}));
    ana.appendChild(el('button',{class:'ekle buyuk',type:'button',text:'+ Yeni kampanya ekle',onclick:function(){ kampanyaSec(null); }}));
    if(window.Sortable) Sortable.create(liste,{animation:180,handle:'.tutamak',ghostClass:'surukleniyor',chosenClass:'secili',delay:120,delayOnTouchOnly:true,onEnd:function(){
      site.kampanyalar=[].map.call(liste.querySelectorAll('.kmp-kart'),function(r){ return r._k; }); degisiklik(); kampanyaCiz();
    }});
    window.scrollTo(0,kaydirma);
  }

  // ---------- Ziyaretçiler sekmesi ----------
  var KURALLAR='{\n  "rules": {\n    "ziyaret": {\n      ".read": true,\n      "$gun": {\n        "$sayfa": {\n          ".validate": "$gun.matches(/^20[0-9][0-9]-[01][0-9]-[0-3][0-9]$/) && ($sayfa === \'menu\' || $sayfa === \'anasayfa\')",\n          ".write": "newData.isNumber() && newData.val() === (data.exists() ? data.val() : 0) + 1"\n        }\n      }\n    }\n  }\n}';
  function gunEkle(t, n){ var d=new Date(t+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
  function ziyaretCiz(){
    if(sekme!=='ziyaret') return;
    ana.innerHTML='';
    var adres=(site.sayac||'').trim();
    if(adres){
      var sonuc=el('div',{},[el('p',{class:'yukleniyor',text:'Ziyaretçi sayıları yükleniyor…'})]);
      ana.appendChild(sonuc);
      fetch(adres.replace(/\/+$/,'')+'/ziyaret.json',{cache:'no-store'}).then(function(r){ if(!r.ok) throw r; return r.json(); }).then(function(v){
        v=v||{}; sonuc.innerHTML='';
        var bugun=A.tarih?A.tarih():new Date().toISOString().slice(0,10);
        function topla(gunler){ var m=0,a=0; gunler.forEach(function(g){ var x=v[g]||{}; m+=Number(x.menu)||0; a+=Number(x.anasayfa)||0; }); return {m:m,a:a}; }
        function son(n){ var l=[]; for(var i=0;i<n;i++) l.push(gunEkle(bugun,-i)); return l; }
        var tum=topla(Object.keys(v));
        var kutular=[['Bugün',topla([bugun])],['Son 7 gün',topla(son(7))],['Son 30 gün',topla(son(30))],['Toplam',tum]];
        var oz=el('div',{class:'ozet'});
        kutular.forEach(function(k){ oz.appendChild(el('div',{class:'k'},[ el('small',{text:k[0]}), el('strong',{text:String(k[1].m+k[1].a)}), el('span',{text:'Menü '+k[1].m+' · Ana sayfa '+k[1].a}) ])); });
        sonuc.appendChild(oz);
        var gunler=son(14), max=1;
        gunler.forEach(function(g){ var x=v[g]||{}; max=Math.max(max,(Number(x.menu)||0)+(Number(x.anasayfa)||0)); });
        var kart=el('div',{class:'kart gunluk'},[el('h3',{text:'Son 14 gün'})]);
        gunler.forEach(function(g){
          var x=v[g]||{}, m=Number(x.menu)||0, a=Number(x.anasayfa)||0;
          var c=el('div',{class:'cubuk'},[ el('div',{class:'m',style:'width:'+(m/max*100)+'%'}), el('div',{class:'a',style:'width:'+(a/max*100)+'%'}) ]);
          kart.appendChild(el('div',{class:'s'},[ el('span',{class:'t',text:g.slice(8,10)+'.'+g.slice(5,7)}), c, el('span',{class:'n',text:String(m+a)}) ]));
        });
        kart.appendChild(el('div',{class:'lejant'},[ el('span',{},[el('i',{style:'background:var(--bordo)'}),'Menü']), el('span',{},[el('i',{style:'background:#d9a3ac'}),'Ana sayfa']) ]));
        sonuc.appendChild(kart);
        sonuc.appendChild(el('p',{class:'ipucu',text:'Her kişi bir oturumda sayfa başına bir kez sayılır. Sayılar Türkiye saatine göredir.'}));
      }).catch(function(){
        sonuc.innerHTML=''; sonuc.appendChild(el('p',{class:'bilgi',text:'Ziyaretçi sayıları okunamadı. Aşağıdaki sayaç adresini ve Firebase kurallarını kontrol edin.'}));
      });
    } else {
      ana.appendChild(el('p',{class:'bilgi',text:'Ziyaretçi sayacı henüz kurulmadı. Aşağıdaki adımları bir kez yapın (ücretsiz, yaklaşık 5 dakika).'}));
    }

    var kur=el(adres?'details':'div',{class:'kart'});
    kur.appendChild(el(adres?'summary':'h3',{text:'Sayaç kurulumu'}));
    var ol=el('ol',{class:'adimlar'});
    ['console.firebase.google.com adresine işletmenin Gmail hesabıyla girin. "Proje oluştur"a basın, ad olarak aran-sayac yazın, Google Analytics\'i kapatıp oluşturun.',
     'Sol menüden "Derleme (Build) → Realtime Database"e girin, "Veritabanı oluştur"a basın. Konum olarak Belçika (europe-west1) seçin, "Kilitli modda başlat" deyip etkinleştirin.',
     '"Kurallar (Rules)" sekmesindeki her şeyi silip aşağıdaki kuralları yapıştırın ve "Yayınla"ya basın.',
     '"Veri (Data)" sekmesinin üstündeki https://… ile başlayan adresi kopyalayıp aşağıdaki kutuya yapıştırın, sonra Kaydet\'e basın.'
    ].forEach(function(t){ ol.appendChild(el('li',{text:t})); });
    kur.appendChild(ol);
    var pre=el('pre',{class:'kurallar',text:KURALLAR});
    var kop=el('button',{class:'kucuk-btn',type:'button',text:'Kuralları kopyala',onclick:function(){
      var bitti=function(){ kop.textContent='Kopyalandı ✓'; setTimeout(function(){ kop.textContent='Kuralları kopyala'; },2000); };
      if(navigator.clipboard) navigator.clipboard.writeText(KURALLAR).then(bitti,function(){ secTum(pre); });
      else secTum(pre);
    }});
    kur.appendChild(pre); kur.appendChild(kop);
    var sa=alan('Sayaç adresi', site, 'sayac', {ph:'https://aran-sayac-default-rtdb.europe-west1.firebasedatabase.app', ipucu:'Kaydettikten sonra siteye gelen ziyaretler sayılmaya başlar.'});
    sa.style.marginTop='16px'; kur.appendChild(sa);
    ana.appendChild(kur);
  }
  function secTum(n){ var r=document.createRange(); r.selectNodeContents(n); var s=getSelection(); s.removeAllRanges(); s.addRange(r); }

  // ---------- Sürükleyerek sıralama (menü) ----------
  function siradanOku(){
    menu.kategoriler=[].map.call(ana.querySelectorAll('.kategori'),function(b){
      b._kat.urunler=[].map.call(b.querySelectorAll('.urun'),function(r){ return r._u; });
      return b._kat;
    });
    degisiklik();
  }
  function siralamaKur(){
    if(!window.Sortable) return;
    var ortak={animation:180,ghostClass:'surukleniyor',chosenClass:'secili',delay:120,delayOnTouchOnly:true,onEnd:siradanOku};
    ana.querySelectorAll('.urun-listesi').forEach(function(l){
      Sortable.create(l,Object.assign({},ortak,{group:'urunler',draggable:'.urun',handle:'.urun > .tutamak'}));
    });
    var kl=document.getElementById('katListe');
    if(kl) Sortable.create(kl,Object.assign({},ortak,{draggable:'.kategori',handle:'.kat-tutamak'}));
  }

  // ---------- Fotoğraf seçme: büyük + küçük kopya ----------
  function kucult(img, max, kalite){
    var o=Math.min(1,max/Math.max(img.width,img.height));
    var c=document.createElement('canvas'); c.width=Math.round(img.width*o); c.height=Math.round(img.height*o);
    var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',kalite);
  }
  dosyaInput.addEventListener('change',function(){
    var f=dosyaInput.files[0], u=fotoHedef; if(!f||!u) return;
    var url=URL.createObjectURL(f), img=new Image();
    img.onload=function(){
      var buyuk=kucult(img,1200,0.8), kucuk=kucult(img,360,0.75), ad='images/'+slug(u.ad)+'-'+Date.now();
      u._yeniFoto={buyukUrl:buyuk,kucukUrl:kucuk,buyuk64:buyuk.split(',')[1],kucuk64:kucuk.split(',')[1],yol:ad+'.jpg',kyol:ad+'-k.jpg'};
      URL.revokeObjectURL(url); degisiklik(); menuCiz();
    };
    img.onerror=function(){ durum('Bu fotoğraf açılamadı. Başka bir fotoğraf deneyin.','hata'); };
    img.src=url;
  });

  // ---------- Kaydetme: menü + site + yeni fotoğraflar; kullanılmayan fotoğraflar silinir ----------
  function temizMenu(){
    return { kategoriler: menu.kategoriler.map(function(k){
      var o={ad:(k.ad||'').trim()}; if((k.ad_en||'').trim()) o.ad_en=k.ad_en.trim();
      o.urunler=(k.urunler||[]).filter(function(u){ return (u.ad||'').trim(); }).map(function(u){
        var r={ad:u.ad.trim()};
        if((u.ad_en||'').trim()) r.ad_en=u.ad_en.trim();
        r.fiyat=Number(u.fiyat)||0;
        r.foto=u._yeniFoto?u._yeniFoto.yol:(u.foto||'');
        r.kucuk=u._yeniFoto?u._yeniFoto.kyol:(u.foto?(u.kucuk||''):'');
        r.gunler=(A.gunler?A.gunler(u):(u.gun?[u.gun]:[])); r.yildiz=!!u.yildiz; r.tukendi=!!u.tukendi; r.gizli=!!u.gizli;
        return r;
      });
      return o;
    }).filter(function(k){ return k.ad; }) };
  }
  function temizSite(){
    var s=kopya(site), c={};
    Object.keys(s.ceviri||{}).forEach(function(k){ if((s.ceviri[k]||'').trim()) c[k]=s.ceviri[k].trim(); });
    s.ceviri=c; s.sayac=(s.sayac||'').trim();
    s.anasayfa.bolumler=(s.anasayfa.bolumler||[]).filter(function(b){ return (b.baslik||'').trim()||(b.metin||'').trim(); });
    delete s.kampanya;
    s.kampanyalar=(site.kampanyalar||[]).map(function(k){
      return {aktif:!!k.aktif, foto:k._yeni?k._yeni.yol:(k.foto||''), anasayfa:k.anasayfa!==false, menu:k.menu!==false, bitis:k.bitis||''};
    }).filter(function(k){ return k.foto; });
    if(s.isletme){ ['whatsapp','harita'].forEach(function(a){ if(s.isletme[a]!=null) s.isletme[a]=String(s.isletme[a]).trim(); }); }
    return s;
  }

  // Küçük kopyası olmayan eski fotoğraflar için menüde kullanılacak küçük kopya hazırla
  function kucukKopyalar(tm, girdiler){
    var eksik=[]; tm.kategoriler.forEach(function(k){ k.urunler.forEach(function(u){ if(u.foto && !u.kucuk && !/^(https?:|data:)/.test(u.foto)) eksik.push(u); }); });
    var hazir={};
    return Promise.all(eksik.map(function(u){
      var hedef=u.foto.replace(/\.(jpe?g|png|webp)$/i,'')+'-k.jpg';
      if(hazir[hedef]){ u.kucuk=hedef; return null; }
      return new Promise(function(coz){
        var img=new Image();
        img.onload=function(){
          try{
            var d=kucult(img,360,0.75);
            girdiler.push({path:hedef,mode:'100644',type:'blob',_b64:d.split(',')[1]});
            hazir[hedef]=1; u.kucuk=hedef; onbellek[hedef]=d;
          }catch(e){}
          coz();
        };
        img.onerror=function(){ coz(); };
        img.src=KOK+u.foto+'?v=1';
      });
    }));
  }

  kaydetBtn.addEventListener('click',function(){
    kaydetBtn.disabled=true; durum('Kaydediliyor…');
    var yeniFotolar=[]; menu.kategoriler.forEach(function(k){ (k.urunler||[]).forEach(function(u){ if(u._yeniFoto) yeniFotolar.push(u); }); });
    var tm=temizMenu(), ts=temizSite(), yeniKmp=(site.kampanyalar||[]).filter(function(k){ return k._yeni; }).map(function(k){ return k._yeni; });

    if(DEMO){ setTimeout(function(){ degisti=false; durum('Önizleme: gerçek panelde siteniz şimdi güncellenirdi','tamam'); },600); return; }

    var bas, agac, girdiler=[], kullanilan={};
    durum('Fotoğraflar hazırlanıyor…');
    kucukKopyalar(tm, girdiler).then(function(){
      tm.kategoriler.forEach(function(k){ k.urunler.forEach(function(u){ if(u.foto) kullanilan[u.foto]=1; if(u.kucuk) kullanilan[u.kucuk]=1; }); });
      (ts.kampanyalar||[]).forEach(function(k){ if(k.foto) kullanilan[k.foto]=1; });
      durum('Kaydediliyor…');
      return gh('/git/ref/heads/'+encodeURIComponent(dal));
    }).then(function(ref){
      bas=ref.object.sha; return gh('/git/commits/'+bas);
    }).then(function(c){
      agac=c.tree.sha;
      return gh('/git/trees/'+agac+'?recursive=1').catch(function(){ return {tree:[],truncated:true}; });
    }).then(function(t){
      // Artık hiçbir üründe kullanılmayan fotoğrafları sil
      if(!t.truncated) (t.tree||[]).forEach(function(n){
        if(n.type==='blob' && /^images\//.test(n.path) && !kullanilan[n.path]) girdiler.push({path:n.path,mode:'100644',type:'blob',sha:null});
      });
      var islemler=[];
      yeniKmp.forEach(function(y){ islemler.push(gh('/git/blobs',{method:'POST',body:{content:y.b64,encoding:'base64'}}).then(function(b){ girdiler.push({path:y.yol,mode:'100644',type:'blob',sha:b.sha}); })); });
      girdiler.filter(function(g){ return g._b64; }).forEach(function(g){
        islemler.push(gh('/git/blobs',{method:'POST',body:{content:g._b64,encoding:'base64'}}).then(function(b){ g.sha=b.sha; delete g._b64; }));
      });
      return Promise.all(islemler.concat(yeniFotolar.map(function(u){
        var f=u._yeniFoto;
        return Promise.all([
          gh('/git/blobs',{method:'POST',body:{content:f.buyuk64,encoding:'base64'}}),
          gh('/git/blobs',{method:'POST',body:{content:f.kucuk64,encoding:'base64'}})
        ]).then(function(b){
          girdiler.push({path:f.yol,mode:'100644',type:'blob',sha:b[0].sha});
          girdiler.push({path:f.kyol,mode:'100644',type:'blob',sha:b[1].sha});
        });
      })));
    }).then(function(){
      girdiler.push({path:'menu.json',mode:'100644',type:'blob',content:JSON.stringify(tm,null,2)+'\n'});
      girdiler.push({path:'site.json',mode:'100644',type:'blob',content:JSON.stringify(ts,null,2)+'\n'});
      return gh('/git/trees',{method:'POST',body:{base_tree:agac,tree:girdiler}});
    }).then(function(t){
      return gh('/git/commits',{method:'POST',body:{message:'Site güncellendi',tree:t.sha,parents:[bas]}});
    }).then(function(c){
      return gh('/git/refs/heads/'+encodeURIComponent(dal),{method:'PATCH',body:{sha:c.sha}});
    }).then(function(){
      yeniFotolar.forEach(function(u){ onbellek[u._yeniFoto.kyol]=u._yeniFoto.kucukUrl; onbellek[u._yeniFoto.yol]=u._yeniFoto.buyukUrl; });
      yeniKmp.forEach(function(y){ onbellek[y.yol]=y.url; });
      menu=kopya(tm); site=ts; site.ceviri=site.ceviri||{}; site.kampanyalar=site.kampanyalar||[]; degisti=false; sekmeGoster(sekme);
      durum('Kaydedildi ✓ Site 1–2 dakika içinde güncellenir','tamam');
    }).catch(function(e){
      kaydetBtn.disabled=false;
      if(e && e.status===401) durum('Oturum süresi dolmuş. Çıkış yapıp yeni anahtarla girin.','hata');
      else if(e && (e.status===422||e.status===409)) durum('Site başka yerden değişmiş. Sayfayı yenileyin.','hata');
      else durum('Kaydedilemedi. İnternetinizi kontrol edip tekrar Kaydet\'e basın.','hata');
    });
  });

  // Çıkış bağlantısı (sayfanın en altında)
  var cikis=el('p',{style:'text-align:center;margin:30px 0 10px'},[ el('button',{type:'button',style:'border:0;background:none;color:var(--soluk);text-decoration:underline;font-size:14px',text:'Bu cihazdan çıkış yap',onclick:function(){ sakla(ANAHTAR_KEY,null); location.reload(); }}) ]);

  // ---------- Başlangıç ----------
  if(!DEMO){ document.querySelector('main').appendChild(cikis); cikis.hidden=true; }
  var eskiGoster=sekmeGoster;
  sekmeGoster=function(s){ eskiGoster(s); if(!DEMO) cikis.hidden=false; };
  if(DEMO){ yukle(); return; }
  anahtar=oku(ANAHTAR_KEY);
  if(!anahtar){ girisEkrani(); return; }
  gh('').then(function(repo){ dal=repo.default_branch||'main'; yukle(); })
        .catch(function(e){ if(e.status===401||e.status===404){ sakla(ANAHTAR_KEY,null); girisEkrani('Lütfen tekrar giriş yapın.'); } else yukle(); });
})();
