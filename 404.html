<style>
  :root{color-scheme:light;--bordo:#7a1f2b;--krem:#ffffff; --logo-zemin:#ffffff; --altin-k:#a8834f;--altin:#e9d7b7;
    --baslik:"Playfair Display",Georgia,serif;--govde:"Montserrat",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--govde);background:var(--krem);color:var(--bordo);display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased;
    padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  .kutu{max-width:380px;width:100%}
  .logo-svg{display:block;width:min(62vw,240px);height:auto;margin:0 auto}
  h1{font-family:var(--baslik);font-weight:900;font-size:23px;margin-top:24px;text-wrap:balance}
  p{margin-top:8px;color:#5a4a4d;font-size:15px}
  p.en{font-size:14px;opacity:.65;font-style:italic}
  .butonlar{display:grid;gap:10px;margin-top:26px}
  a{display:block;border-radius:14px;padding:14px;font-weight:700;font-size:17px;text-decoration:none}
  a.dolu{background:var(--bordo);color:#fff}
  a.bos{border:1.5px solid var(--bordo);color:var(--bordo)}
  a:focus-visible{outline:2px solid var(--bordo);outline-offset:3px}
</style>
</head>
