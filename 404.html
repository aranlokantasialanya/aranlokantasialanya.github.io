<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı | Aran Lokantası</title>
<meta name="theme-color" content="#7b1f2e">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bordo:#7b1f2e;--krem:#fbf7f2;--altin:#e9d7b7;
    --baslik:"Libre Baskerville",Georgia,serif;--govde:"Source Sans 3",system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--govde);background:var(--bordo);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased;
    padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  .kutu{max-width:380px;width:100%}
  .cerceve{position:relative;border:1px solid rgba(255,255,255,.55);padding:30px 16px 24px}
  .cerceve::after{content:"";position:absolute;inset:6px;border:1px solid rgba(233,215,183,.4);pointer-events:none}
  .logo{font-family:var(--baslik);font-size:42px;letter-spacing:.32em;padding-left:.32em;line-height:1}
  .cizgi{width:60px;height:2px;background:#fff;margin:12px auto}
  .alt{letter-spacing:.45em;padding-left:.45em;font-size:14px;text-transform:uppercase}
  h1{font-family:var(--baslik);font-size:21px;margin-top:30px;text-wrap:balance}
  p{margin-top:8px;opacity:.85;font-size:16px}
  p.en{font-size:14px;opacity:.65;font-style:italic}
  .butonlar{display:grid;gap:10px;margin-top:26px}
  a{display:block;border-radius:14px;padding:14px;font-weight:700;font-size:17px;text-decoration:none}
  a.dolu{background:#fff;color:var(--bordo)}
  a.bos{border:1.5px solid rgba(255,255,255,.8);color:#fff}
  a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div class="kutu">
  <div class="cerceve">
    <div class="logo">ARAN</div>
    <div class="cizgi"></div>
    <div class="alt">Lokantası</div>
  </div>
  <h1>Aradığınız sayfa bulunamadı</h1>
  <p>Adres yanlış yazılmış ya da sayfa kaldırılmış olabilir.</p>
  <p class="en">Page not found.</p>
  <div class="butonlar">
    <a class="dolu" href="/menu/">Menüyü Gör →</a>
    <a class="bos" href="/">Ana Sayfa</a>
  </div>
</div>
</body>
</html>
