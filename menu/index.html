<style>
  /* Basılı A5 menünün dijital hali: bordo başlık bandı, serif bölüm başlıkları, kutulu fiyatlar, gün etiketleri */
  :root{
    color-scheme:light;
    --bordo:#7a1f2b; --bordo-koyu:#5c1620; --pembe:#f6e3e5; --krem:#ffffff; --logo-zemin:#ffffff; --altin-k:#a8834f; --kart:#ffffff;
    --yazi:#2a2224; --soluk:#7f7174; --cizgi:#e8dcd6; --nokta:#cbb9b3; --kirmizi:#b3261e; --altin:#e9d7b7;
    --baslik:"Playfair Display",Georgia,serif; --govde:"Montserrat",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth;scroll-padding-top:64px;-webkit-text-size-adjust:100%}
  body{font-family:var(--govde);background:var(--krem);color:var(--yazi);line-height:1.35;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--bordo);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  .ic{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* Üst kısım: yatay logo (bordo şerit) */
  header{background:var(--bordo);color:#fff;text-align:center;padding-top:env(safe-area-inset-top,0px);position:relative}
  header::after{content:"";position:absolute;inset:7px;border:1px solid rgba(233,215,183,.55);border-radius:4px;pointer-events:none}
  header .ic{padding-block:14px 18px;position:relative;z-index:1}
  .ust{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .geri{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:7px 12px 7px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35)}
  .geri svg{width:18px;height:18px}
  .dil{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px}
  .dil button{border:0;background:transparent;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;letter-spacing:.06em}
  .dil button[aria-pressed="true"]{background:#fff;color:var(--bordo)}
  .marka{margin:10px auto 0;display:flex;flex-direction:column;align-items:center}
  .m-ad{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:clamp(46px,15vw,64px);line-height:1;letter-spacing:.02em}
  .m-orta{display:flex;align-items:center;gap:10px;color:#e9d7b7;margin:8px 0 6px;width:min(64vw,250px)}
  .m-orta span{flex:1;height:1px;background:currentColor;opacity:.85}
  .m-alet{width:34px;height:27px;flex:none}
  .m-alt{font-family:var(--govde);font-weight:600;font-size:clamp(13px,4vw,16px);letter-spacing:.42em;margin-right:-.42em}
  .m-yil{font-family:var(--govde);font-weight:500;font-size:10.5px;letter-spacing:.38em;margin-right:-.38em;color:#e9d7b7;margin-top:6px}

  /* Kategori şeridi */
  nav{position:sticky;top:0;z-index:10;background:var(--krem);border-bottom:1px solid var(--cizgi)}
  nav .serit{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-block:8px}
  nav .serit::-webkit-scrollbar{display:none}
  nav a{flex-shrink:0;padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--bordo);text-decoration:none;white-space:nowrap}
  nav a.aktif{background:var(--bordo);color:#fff}

  /* Bugünün yemeği */
  .bugun{margin-top:18px;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .bugun .etiket{flex-shrink:0;background:var(--bordo);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:6px 8px;text-align:center;line-height:1.15;max-width:84px}
  .bugun .metin{flex:1;min-width:0}
  .bugun .g-foto{flex-shrink:0;width:72px;height:72px;border-radius:12px;position:relative;border:0;padding:0;cursor:zoom-in;background:var(--cizgi)}
  .bugun .g-foto img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .bugun .g-etiket{display:inline-block;background:var(--bordo);color:#fff;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-bottom:3px}
  .bugun small{display:block;color:var(--soluk);font-size:13px}
  .bugun strong{font-size:17px}

  main{padding-bottom:8px}
  section{margin-top:26px}
  h2{font-family:var(--baslik);color:var(--bordo);font-size:18px;letter-spacing:.1em;text-transform:uppercase;padding-bottom:7px;border-bottom:2px solid var(--bordo);text-wrap:balance}

  .urun{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--cizgi)}
  .urun:last-of-type{border-bottom:0}
  .foto{width:76px;height:76px;border-radius:12px;flex-shrink:0;position:relative;max-width:100%}
  .foto.bos{background:#f3ebe5;border:1px dashed #e0d2cb}
  button.foto{border:0;padding:0;cursor:zoom-in;background:var(--cizgi);box-shadow:0 1px 3px rgba(0,0,0,.15);overflow:visible}
  button.foto img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
  .buyutec{position:absolute;right:-5px;bottom:-5px;width:26px;height:26px;border-radius:50%;background:var(--bordo);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--krem);box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .buyutec svg{width:14px;height:14px}
  .govde{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
  .isim{min-width:0;font-size:16px;font-weight:500}
  .isim .y{color:var(--bordo);font-weight:700;margin-left:1px}
  .orijinal{display:block;font-size:13px;color:var(--soluk);font-style:italic;margin-top:1px}
  .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .gun{display:inline-block;background:var(--pembe);color:var(--bordo);font-weight:700;font-size:12px;border-radius:999px;padding:2px 9px}
  .gun.bugun-gun{background:var(--bordo);color:#fff}
  .yok{display:inline-block;background:var(--kirmizi);color:#fff;font-weight:700;font-size:12px;border-radius:999px;padding:2px 9px}
  .nokta{flex:1;min-width:10px;border-bottom:1.5px dotted var(--nokta);align-self:flex-end;margin-bottom:8px}
  .fiyat{flex-shrink:0;min-width:60px;font-size:15px!important;text-align:center;border:1.5px solid var(--cizgi);background:var(--kart);border-radius:8px;padding:4px 8px;font-weight:700;font-size:16px;color:var(--bordo-koyu);font-variant-numeric:tabular-nums}
  .urun.tukendi .isim,.urun.tukendi .foto img{opacity:.45}
  .urun.tukendi .fiyat{text-decoration:line-through;color:var(--soluk)}

  .aciklama{margin-top:10px;background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;color:var(--soluk)}
  .aciklama .y{color:var(--bordo);font-weight:700;text-align:center}

  .durum{text-align:center;color:var(--soluk);padding:48px 0}

  footer{background:var(--bordo);color:#fff;text-align:center;margin-top:34px;padding-bottom:env(safe-area-inset-bottom,0px)}
  footer .ic{padding-block:26px 30px}
  .paket{font-family:var(--baslik);font-size:18px;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--bordo);text-decoration:none;font-weight:700;padding:11px 20px;border-radius:999px;margin:4px;font-size:16px}
  .btn.cizgili{background:transparent;color:#fff;border:1.5px solid #fff}
  .adres{margin-top:14px;font-size:14px;opacity:.9}
  .ana-link{display:inline-block;margin-top:16px;color:#fff;opacity:.85;font-size:14px}
  .btn.wa{background:#1f9e57;color:#fff}
  .btn svg{width:18px;height:18px}

  /* Kampanya penceresi (kaydırmalı) */
  .kmp{position:fixed;inset:0;z-index:95;background:rgba(20,8,11,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));animation:kmp-gel .35s ease}
  .kmp-kutu{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
  .kmp-cerceve{position:relative;width:min(calc(100vw - 32px),420px,calc((100vh - 190px) * .5625));width:min(calc(100vw - 32px),420px,calc((100dvh - 190px) * .5625))}
  .kmp-serit{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.45);background:#1d1d1d;overscroll-behavior:contain}
  .kmp-serit::-webkit-scrollbar{display:none}
  .kmp-serit img{flex:0 0 100%;width:100%;aspect-ratio:9/16;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always;display:block;user-select:none;-webkit-user-drag:none}
  .kmp-kapat{position:absolute;top:-14px;right:-10px;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:var(--bordo);color:#fff;font-size:26px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35);z-index:2}
  .kmp-nokta{display:flex;gap:4px}
  .kmp-nokta button{width:24px;height:24px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .kmp-nokta button::after{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:width .2s ease,background .2s ease}
  .kmp-nokta button[aria-current="true"]::after{width:22px;border-radius:4px;background:#fff}
  .kmp-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-width:220px;border:0;border-radius:14px;padding:14px 22px;background:#fff;color:var(--bordo);font:inherit;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer}
  @keyframes kmp-gel{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.kmp{animation:none}}

  #buyuk{position:fixed;inset:0;z-index:50;background:rgba(20,10,12,.9);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;cursor:zoom-out}
  #buyuk.acik{display:flex}
  #buyuk img{max-width:100%;max-height:76vh;border-radius:14px;background:#222}
  #buyuk .baslik{color:#fff;margin-top:14px;font-family:var(--baslik);font-size:18px;text-align:center}
  #buyuk .kapat{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;color:#fff;font-size:34px;line-height:1;background:rgba(255,255,255,.12);border:0;border-radius:50%;cursor:pointer}

  /* ---------- Açılış: logo animasyonu ---------- */
  #acilis{position:fixed;inset:0;z-index:100;background:var(--krem);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .7s ease, transform .7s ease}
  #acilis.gizlen{opacity:0;transform:scale(1.04);pointer-events:none}
  #acilis svg{width:min(78vw,420px);height:auto;overflow:visible}
  #acilis .arc{stroke-dasharray:0 1100;animation:al-arc 1.3s .9s cubic-bezier(.45,0,.55,1) forwards}
  #acilis .arc.o{--L:356} #acilis .arc.i{--L:331}
  @keyframes al-arc{to{stroke-dasharray:var(--L) 1100}}
  #acilis .pop{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:al-pop .5s ease-out forwards}
  #acilis .p1{animation-delay:.1s} #acilis .p2{animation-delay:.3s} #acilis .p3{animation-delay:.5s}
  @keyframes al-pop{60%{transform:scale(1.25);opacity:1}to{transform:scale(1);opacity:1}}
  #acilis .orbit{transform-origin:200px 200px;animation:al-first 1.3s .9s cubic-bezier(.45,0,.55,1) forwards}
  @keyframes al-first{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  #acilis .t{opacity:0;transform:translateY(10px);transform-box:fill-box;animation:al-up .7s ease-out forwards}
  #acilis .t1{animation-delay:2.2s} #acilis .t3{animation-delay:2.75s} #acilis .t4{animation-delay:3s}
  #acilis .line{transform-origin:center;transform:scaleX(0);transform-box:fill-box;animation:al-grow .6s 2.5s ease-out forwards}
  @keyframes al-up{to{opacity:1;transform:none}}
  @keyframes al-grow{to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){
    #acilis,#acilis *{animation:none!important;transition:none!important}
    #acilis .arc.o{stroke-dasharray:356 1100} #acilis .arc.i{stroke-dasharray:331 1100}
    #acilis .pop,#acilis .t{opacity:1;transform:none} #acilis .line{transform:none} #acilis .orbit{transform:none}
  }
</style>
</head>

/* Açılış animasyonu: her oturumda bir kez (ana sayfada görüldüyse tekrar gösterilmez). Dokununca geçer. */
(function(){
  var a=document.getElementById('acilis'), g=null;
  window.ARAN_ACILIS={bitti:false,bekleyen:[]};
  function haber(){ window.ARAN_ACILIS.bitti=true; window.ARAN_ACILIS.bekleyen.forEach(function(f){ f(); }); window.ARAN_ACILIS.bekleyen=[]; }
  try{ g=sessionStorage.getItem('aran-acilis'); sessionStorage.setItem('aran-acilis','1'); }catch(e){}
  if(g){ haber(); return; }
  var az=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, bitti=false;
  a.hidden=false;
  function bitir(){ if(bitti) return; bitti=true; a.classList.add('gizlen'); setTimeout(function(){ a.hidden=true; haber(); }, az?0:700); }
  a.addEventListener('click',bitir);
  setTimeout(bitir, az?500:3900);
})();
</script>

<script>
/* Tarayıcı eski ceviri.js'yi hafızada tutuyorsa eksik yardımcıları tamamla */
(function(){
  var A=window.ARAN=window.ARAN||{kategori:{},urun:{},gun:{},arayuz:{tr:{},en:{}},arayuzEtiket:{}};
  A.kategori=A.kategori||{}; A.urun=A.urun||{}; A.gun=A.gun||{}; A.arayuz=A.arayuz||{tr:{},en:{}}; A.arayuzEtiket=A.arayuzEtiket||{};
  A.arayuz.tr=A.arayuz.tr||{}; A.arayuz.en=A.arayuz.en||{}; if(!A.arayuz.tr.gizlilik){ A.arayuz.tr.gizlilik='Gizlilik'; A.arayuz.en.gizlilik='Privacy'; }
  if(!A.HAFTA) A.HAFTA=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
  if(!A.gunler) A.gunler=function(u){ var l=Array.isArray(u&&u.gunler)?u.gunler:((u&&u.gun)?[u.gun]:[]); return A.HAFTA.filter(function(g){ return l.indexOf(g)>=0; }); };
  if(!A.tarih) A.tarih=function(){ try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }catch(e){ return new Date().toISOString().slice(0,10); } };
  if(!A.bugunGun) A.bugunGun=function(){ var g=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi']; try{ var s=new Intl.DateTimeFormat('tr-TR',{weekday:'long',timeZone:'Europe/Istanbul'}).format(new Date()); return s.charAt(0).toLocaleUpperCase('tr')+s.slice(1); }catch(e){ return g[new Date().getDay()]; } };
  if(!A.haritaSorgu) A.haritaSorgu=function(i){ i=i||{}; return (i.harita||'').trim()||((i.ad||'Aran Lokantası')+', '+(i.adres||'Alanya')); };
})();
</script>
<script>
(function(){
  var A=window.ARAN||{kategori:{},urun:{},gun:{},arayuz:{tr:{},en:{}}};
  var veri=null, site={}, dil='tr', bugun=A.bugunGun?A.bugunGun():'';
  var IKON_BUYUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></svg>';

  // Dil seçimi: önce kayıtlı tercih, yoksa telefonun dili
  try{ dil=localStorage.getItem('aran-dil')||''; }catch(e){}
  if(dil!=='tr' && dil!=='en'){
    var l=(navigator.languages&&navigator.languages[0])||navigator.language||'tr';
    dil=/^tr/i.test(l)?'tr':'en';
  }

  function y(k){ var o=(dil==='en' && site.ceviri && site.ceviri[k]) ? site.ceviri[k] : null; return o || (A.arayuz[dil]&&A.arayuz[dil][k]) || A.arayuz.tr[k] || ''; }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function slug(s){ return String(s).toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
  function telGoster(t){ var d=(t||'').replace(/\D/g,''); if(d.indexOf('90')===0) d=d.slice(2); if(d.charAt(0)!=='0') d='0'+d; return d.length>=11 ? d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7,9)+' '+d.slice(9) : t; }
  function telLink(t){ var d=(t||'').replace(/\D/g,''); if(d.indexOf('0')===0) d='90'+d.slice(1); if(d.indexOf('90')!==0) d='90'+d; return 'tel:+'+d; }
  function fiyatYaz(f){ return (Number(f)||0).toLocaleString('tr-TR')+'₺'; }
  function yol(p){ return !p ? '' : /^(https?:|data:|\/)/.test(p) ? p : '../'+p; }
  function urunAdi(u){ return dil==='en' ? (u.ad_en || A.urun[u.ad] || u.ad) : u.ad; }
  function katAdi(k){ return dil==='en' ? (k.ad_en || A.kategori[k.ad] || k.ad) : k.ad; }
  function gunAdi(g){ return dil==='en' ? (A.gun[g]||g) : g; }

  var kutu=document.getElementById('buyuk'), bi=kutu.querySelector('img'), bb=kutu.querySelector('.baslik'), kapatBtn=kutu.querySelector('.kapat'), sonOdak=null;
  function buyut(src,ad,btn){ sonOdak=btn; bi.src=src; bi.alt=ad; bb.textContent=ad; kutu.classList.add('acik'); kapatBtn.focus(); }
  function kapat(){ kutu.classList.remove('acik'); if(sonOdak) sonOdak.focus(); }
  kutu.addEventListener('click',kapat);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && kutu.classList.contains('acik')) kapat(); });

  function urunSatiri(u){
    var row=el('div','urun'+(u.tukendi?' tukendi':''));
    var ad=urunAdi(u);
    if(u.foto){
      var b=el('button','foto'); b.type='button'; b.setAttribute('aria-label',y('buyut')+': '+ad);
      var img=el('img'); img.src=yol(u.kucuk||u.foto); img.alt=''; img.loading='lazy'; img.decoding='async';
      b.appendChild(img);
      var bt=el('span','buyutec'); bt.innerHTML=IKON_BUYUT; bt.setAttribute('aria-hidden','true'); b.appendChild(bt);
      b.addEventListener('click',function(){ buyut(yol(u.foto),ad,b); });
      row.appendChild(b);
    } else row.appendChild(el('span','foto bos'));
    var govde=el('div','govde'), isim=el('div','isim');
    isim.appendChild(document.createTextNode(ad));
    if(u.yildiz){ var s=el('span','y','*'); s.title=y('aciklama_yildiz'); isim.appendChild(s); }
    if(dil==='en' && ad!==u.ad) isim.appendChild(el('span','orijinal',u.ad));
    var gl=A.gunler(u);
    if(gl.length||u.tukendi){
      var meta=el('div','meta');
      gl.forEach(function(g){ meta.appendChild(el('span','gun'+(g===bugun?' bugun-gun':''), g===bugun?(gl.length>1?y('bugun')+' · '+gunAdi(g):y('bugun')):gunAdi(g))); });
      if(u.tukendi) meta.appendChild(el('span','yok',y('tukendi')));
      isim.appendChild(meta);
    }
    govde.appendChild(isim); govde.appendChild(el('span','nokta'));
    row.appendChild(govde);
    row.appendChild(el('span','fiyat',fiyatYaz(u.fiyat)));
    return row;
  }

  function ciz(){
    document.documentElement.lang=dil;
    document.querySelectorAll('.dil button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-dil')===dil)); });
    document.querySelectorAll('[data-y]').forEach(function(e){ e.textContent=y(e.getAttribute('data-y')); });
    kapatBtn.setAttribute('aria-label',y('kapat'));
    if(!veri) return;
    var nav=document.getElementById('nav'), main=document.getElementById('menu');
    nav.innerHTML=''; main.innerHTML='';

    var gunun=null;
    (veri.kategoriler||[]).forEach(function(k){ (k.urunler||[]).forEach(function(u){ if(!gunun && !u.gizli && A.gunler(u).indexOf(bugun)>=0) gunun=u; }); });
    if(gunun){
      var kart=el('div','bugun'), gAd=urunAdi(gunun), m=el('div','metin');
      if(gunun.foto){
        var gb=el('button','g-foto'); gb.type='button'; gb.setAttribute('aria-label',y('buyut')+': '+gAd);
        var gi=el('img'); gi.src=yol(gunun.kucuk||gunun.foto); gi.alt=''; gb.appendChild(gi);
        var gbt=el('span','buyutec'); gbt.innerHTML=IKON_BUYUT; gbt.setAttribute('aria-hidden','true'); gb.appendChild(gbt);
        gb.addEventListener('click',function(){ buyut(yol(gunun.foto),gAd,gb); });
        kart.appendChild(gb);
        m.appendChild(el('span','g-etiket',y('gunun_yemegi')));
      } else kart.appendChild(el('span','etiket',y('gunun_yemegi')));
      m.appendChild(el('small',null,gunAdi(bugun))); m.appendChild(el('strong',null,gAd));
      if(gunun.tukendi){ m.appendChild(document.createTextNode(' ')); m.appendChild(el('span','yok',y('tukendi'))); }
      kart.appendChild(m); kart.appendChild(el('span','fiyat',fiyatYaz(gunun.fiyat)));
      main.appendChild(kart);
    }

    (veri.kategoriler||[]).forEach(function(k){
      var urunler=(k.urunler||[]).filter(function(u){ return !u.gizli; });
      if(!urunler.length) return;
      var id=slug(k.ad), ad=katAdi(k);
      var a=el('a',null,ad); a.href='#'+id; nav.appendChild(a);
      var s=el('section'); s.id=id; s.appendChild(el('h2',null,ad));
      urunler.forEach(function(u){ s.appendChild(urunSatiri(u)); });
      var gunVar=urunler.some(function(u){ return A.gunler(u).length; }), yildizVar=urunler.some(function(u){ return u.yildiz; });
      if(gunVar||yildizVar){
        var ac=el('div','aciklama');
        if(gunVar){ ac.appendChild(el('span','gun',y('gun_etiketi'))); ac.appendChild(el('span',null,y('aciklama_gun'))); }
        if(yildizVar){ ac.appendChild(el('span','y','*')); ac.appendChild(el('span',null,y('aciklama_yildiz'))); }
        s.appendChild(ac);
      }
      main.appendChild(s);
    });
    isaretle();
  }

  document.querySelectorAll('.dil button').forEach(function(b){
    b.addEventListener('click',function(){
      dil=b.getAttribute('data-dil'); try{ localStorage.setItem('aran-dil',dil); }catch(e){}
      var yer=window.scrollY; ciz(); window.scrollTo(0,yer);
    });
  });

  // Kaydırdıkça aktif kategoriyi işaretle
  function isaretle(){
    var nav=document.getElementById('nav');
    var linkler=[].slice.call(nav.querySelectorAll('a')), bolumler=[].slice.call(document.querySelectorAll('main section'));
    var yy=window.scrollY+80, aktif=0;
    bolumler.forEach(function(b,ix){ if(b.offsetTop<=yy) aktif=ix; });
    linkler.forEach(function(l,ix){
      var ol=ix===aktif; if(l.classList.contains('aktif')!==ol){ l.classList.toggle('aktif',ol); if(ol) nav.scrollLeft=l.offsetLeft-nav.clientWidth/2+l.offsetWidth/2; }
    });
  }
  window.addEventListener('scroll',isaretle,{passive:true});

  ciz();
  var t=Date.now();
  Promise.all([
    fetch('../menu.json?v='+t,{cache:'no-store'}).then(function(r){ if(!r.ok) throw r; return r.json(); }),
    fetch('../site.json?v='+t,{cache:'no-store'}).then(function(r){ return r.ok?r.json():{}; }).catch(function(){ return {}; })
  ]).then(function(r){
    veri=r[0]; site=r[1]||{};
    var i=site.isletme||veri.isletme||{};
    if(i.slogan){ var sl=i.slogan.toLocaleUpperCase('tr'); document.getElementById('slogan').textContent=sl; document.getElementById('acilisYil').textContent=sl; }
    if(i.telefon){ var tl=document.getElementById('tel'); tl.href=telLink(i.telefon); document.getElementById('telYazi').textContent=telGoster(i.telefon); }
    if(i.adres){
      document.getElementById('adres').textContent=i.adres;
    }
    document.getElementById('harita').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(A.haritaSorgu?A.haritaSorgu(i):((i.ad||'Aran Lokantası')+' '+(i.adres||'')));
    if(i.whatsapp && A.waLink){ var wb=document.getElementById('waBtn'); wb.href=A.waLink(i.whatsapp, dil==='en'?'Hello, ':'Merhaba, '); wb.hidden=false; }
    ciz();
    if(A.say) A.say('menu', site.sayac);
    // Kampanya görseli (açılış animasyonu bittikten sonra)
    if(A.kampanyaVar && A.kampanyaVar(site,'menu')){
      var goster=function(){
        var b=el('button','kmp-btn',dil==='en'?'View menu':'Menüye geç'); b.type='button';
        var kapat=A.kampanyaGoster(site,'../',b,null,'menu'); b.addEventListener('click',function(){ kapat(); });
      };
      var ac=window.ARAN_ACILIS;
      if(!ac || ac.bitti) goster(); else ac.bekleyen.push(goster);
    }
  }).catch(function(){
    document.getElementById('menu').innerHTML='';
    document.getElementById('menu').appendChild(el('p','durum',y('hata')));
  });
})();
</script>
</body>
</html>
